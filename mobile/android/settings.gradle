rootProject.name = 'SmartTVInstaller'
apply from: new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../scripts/settings.gradle")
include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', {paths: [rootDir]})"].execute(null, rootDir).text.trim()).getParentFile())
