apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "io.github.smarttvinstaller"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.github.smarttvinstaller"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("com.facebook.react:react-android:0.76.5")
    implementation("com.facebook.react:hermes-android:0.76.5")
    implementation project(':react-native-tcp-socket')
    implementation project(':react-native-fs')
}
